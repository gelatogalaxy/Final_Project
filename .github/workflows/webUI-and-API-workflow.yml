# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Chrome & Driver Alternate
      uses: browser-actions/setup-chrome@v2
      with:
        chrome-version: 153.0.8010.52
        install-chromedriver: true

    - name: Build (without tests)
      run: |
        chmod +x gradlew
        ./gradlew build -x test

    - name: Run Tests
      run: ./gradlew test
      
    - name: Prepare report for publishing
      if: always()
      run: |
        mkdir -p public
        if [ -f reports/cucumber.html ]; then
          cp reports/cucumber.html public/index.html
          cp -f reports/cucumber.json public/ 2>/dev/null || true
        else
          echo "<html><body><h1>No cucumber report was generated</h1></body></html>" > public/index.html
          fi
          
    - name: Archive test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cucumber-reports
        path: public

    - name: Deploy to GitHub Pages
      if: always() && github.event_name != 'pull_request'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
